version: "3"
tasks:
  gen:
    cmds:
      - go generate
  test:
    cmds:
      - go test ./...
  clear:
    dir: cmd
    cmds:
      - rm -rf ndor/examples/*.html
      - rm -rf ../pkg/goldmark/testdata/*.html
  cli:
    cmds:
      - go run ./cmd/ndor {{.CLI_ARGS}}
  gui:
    cmds:
      - go run ./cmd/gui
