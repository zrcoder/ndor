version: "3"
tasks:
  gen:
    cmds:
      - go generate
  test:
    cmds:
      - go test ./...
  clean:
    dir: cmd
    cmds:
      - rm -rf ndor/examples/*.html
      - rm -rf ../pkg/goldmark/testdata/*.html
  cli:
    cmds:
      - go run ./cmd/ndor {{.CLI_ARGS}}
  gui:
    dir: cmd/gui
    cmds:
      - go tool mygo dev
  build:
    dir: cmd/gui
    cmds:
      - go tool mygo build
  build-web:
    dir: cmd/gui
    cmds:
      - go tool mygo build -platform web
  vet:
    cmds:
      - go tool mygo vet ./cmd/gui
      - go vet ./...
  fix:
    cmds:
      - go tool mygo migrate-ui -write ./cmd/gui
      - go fix ./...
