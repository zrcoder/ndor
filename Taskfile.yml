version: "3"
tasks:
  gen:
    cmds:
      - go generate ./...
      - (cd cmd/gui && go tool mygo generate)
  test:
    cmds:
      - go test ./...
  clean:
    dir: cmd
    cmds:
      - rm -rf ndor/examples/*.html
      - rm -rf ../internal/goldmark/testdata/*.html
      - rm -rf ../internal/exported
      - rm -rf ../internal/examples/ndor/*.svg
      - rm -rf gui/build
      - rm -rf gui/.mygo
      - rm -rf gui/*.png
      - rm -f gui/internal/locales/catalog_gen.go
  cli:
    deps: [gen]
    cmds:
      - go run ./cmd/ndor {{.CLI_ARGS}}
  gui:
    deps: [gen]
    dir: cmd/gui
    cmds:
      - go tool mygo dev
  build:
    deps: [gen]
    dir: cmd/gui
    cmds:
      - go tool mygo build
  build-web:
    deps: [gen]
    dir: cmd/gui
    cmds:
      - go tool mygo build -platform web
  vet:
    cmds:
      - go tool mygo vet ./cmd/gui
      - go vet ./...
  fix:
    cmds:
      - go tool mygo install-skills
      - go tool mygo migrate-ui -write ./cmd/gui
      - go fix ./...
