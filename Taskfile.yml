version: "3"
tasks:
  gen:
    cmds:
      - go generate
  build:
    dir: cmd/web
    cmds:
      - GOARCH=wasm GOOS=js go build -o static/web/app.wasm
      - go build  -o static/app
      - cd static && ./app && rm ./app
  run:
    deps: [build]
    dir: cmd/web/static
    cmds:
      - go run ../tools/server
  clear:
    dir: cmd/web/static
    cmds:
      - rm -rf web
      - rm -f *.js
      - rm -f *.html
      - rm -f manifest*
      - rm -f app.css
  cli:
    cmds:
      - go run ./cmd/ndor {{.CLI_ARGS}}
